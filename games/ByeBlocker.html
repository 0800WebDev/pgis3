<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ByeBlocker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(
        circle,
        rgb(0, 0, 0),
        rgb(1, 44, 42)
      );
    }

    .star {
      position: absolute;
      background: rgb(57, 255, 215);
      border-radius: 50%;
      animation:
        sparkle 2s infinite,
        drift 4s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%,
      100% {
        opacity: 0;
        scale: 0;
      }

      50% {
        opacity: 1;
        scale: 1;
      }
    }

    @keyframes drift {
      0%,
      100% {
        translate: 0 0;
      }

      50% {
        translate: 50px -50px;
      }
    }

    .image-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .image {
      width: 250px;
      height: 250px;
      border: 2px solid #daf3f1;
      margin: 40px;
      padding: 10px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .image:hover {
      transform: scale(1.1);
      border-color: #9900ff;
    }

    .bottom-left {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 10;
      padding: 10px;
      color: rgba(255, 255, 255, 0.2);
      font-size: 16px;
      pointer-events: none;
    }

    #byeBlockerMenu {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      width: 200px;
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      border-radius: 5px;
      user-select: none;
    }

    #byeBlockerMenuContent {
      padding: 10px;
      cursor: move;
    }

    #byeBlockerClose {
      float: right;
      cursor: pointer;
      color: #333;
      font-size: 20px;
      line-height: 20px;
    }

    #byeBlockerButton {
      display: block;
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #333;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 16px;
      cursor: pointer;
    }

    #byeBlockerButton:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div id="background"></div>

  <div id="byeBlockerMenu">
    <div id="byeBlockerMenuContent">
      <span id="byeBlockerClose">&times;</span>

      <button id="byeBlockerButton">
        Launch ByeBlocker
      </button>
    </div>
  </div>

  <div class="bottom-left">
    Tacogamerman on github
  </div>

  <script>
    const numStars = 300;
    const background = document.getElementById("background");

    for (let i = 0; i < numStars; i++) {
      const star = document.createElement("div");

      star.className = "star";

      const size = Math.random() * 3;

      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDelay = `${Math.random() * 2}s`;

      background.appendChild(star);
    }

    const menu = document.getElementById("byeBlockerMenu");
    const menuContent = document.getElementById("byeBlockerMenuContent");
    const closeButton = document.getElementById("byeBlockerClose");
    const launchButton = document.getElementById("byeBlockerButton");

    closeButton.addEventListener("click", () => {
      menu.remove();
    });

    launchButton.addEventListener("click", () => {
      const link = prompt("Url?");

      if (!link) {
        return;
      }

      const proxy = "https://api.codetabs.com/v1/proxy?quest=";

      fetch(proxy + link)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          return response.text();
        })
        .then(text => {
          document.open();
          document.write(text);
          document.close();
        })
        .catch(error => {
          console.error("ByeBlocker error:", error);
        });
    });

    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    menuContent.addEventListener("mousedown", event => {
      if (event.target === closeButton || event.target === launchButton) {
        return;
      }

      isDragging = true;

      const rect = menu.getBoundingClientRect();

      offsetX = event.clientX - rect.left;
      offsetY = event.clientY - rect.top;
    });

    document.addEventListener("mousemove", event => {
      if (!isDragging) {
        return;
      }

      menu.style.left = `${event.clientX - offsetX}px`;
      menu.style.top = `${event.clientY - offsetY}px`;
      menu.style.right = "auto";
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
    });
  </script>

</body>
</html>
