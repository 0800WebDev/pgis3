<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hyperbeam</title>
<style>
html,body,#hb{
    width:100%;
    height:100%;
    margin:0;
}
</style>
</head>
<body>

<div id="hb"></div>
    
<script type="module">
import Hyperbeam from "https://unpkg.com/@hyperbeam/web@latest/dist/index.js";

const data = await fetch("/api/computer").then(r => r.json());
console.log(data);

await Hyperbeam(
  document.getElementById("hb"),
  data.embed_url
);
</script>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
eruda.init();
</script>
</body>
</html>
