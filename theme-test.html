<script>
async function initBattery() {
  if (!navigator.getBattery) {
    document.getElementById("batteryText").textContent = "N/A";
    return;
  }

  const battery = await navigator.getBattery();

  function update() {
    const level = Math.round(battery.level * 100);

    document.getElementById("batteryText").textContent = level + "%";

    const fill = document.getElementById("batteryLevel");
    fill.setAttribute("width", (level / 100) * 16.57);
  }

  update();

  battery.addEventListener("levelchange", update);
  battery.addEventListener("chargingchange", update);
}

initBattery();
</script>

<script>
  function fps() {
(() => {
    const fpsCounter = document.getElementById("fps-counter");

    let frames = 0;
    let lastTime = performance.now();

    function loop(now) {
        frames++;

        if (now >= lastTime + 1000) {
            const fps = Math.round((frames * 1000) / (now - lastTime));
            fpsCounter.textContent = `FPS: ${fps}`;
            frames = 0;
            lastTime = now;
        }

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
})();
  }
  fps();
</script>

<script>
async function loadSplash() {
    const splashEl = document.getElementById("splash");
    const time = new Date().getHours();

    const randomSentences = await fetch("splash.json")
        .then(r => r.json());

    let splash = "";

    if (Math.random() < 0.5) {
        const randomIndex = Math.floor(Math.random() * randomSentences.length);
        splash = randomSentences[randomIndex];
    } else {
        if (time < 6) splash = "A bit late?";
        else if (time < 12) splash = "Good morning!";
        else if (time < 18) splash = "Ready to play?";
        else splash = "Still playing?";
    }

    splashEl.innerHTML = splash;
}

loadSplash();
</script>

<script>
  
const games = document.getElementById("games");

const observer = new MutationObserver((mutations) => {
  for (const mutation of mutations) {
    for (const node of mutation.addedNodes) {
      if (node.nodeType !== 1) continue;

      const targets = node.querySelectorAll
        ? [node, ...node.querySelectorAll(".gamediv")]
        : [node];

      for (const el of targets) {
        if (!el.classList || !el.classList.contains("gamediv")) continue;

        el.classList.add("game-item");

        requestAnimationFrame(() => {
          el.classList.add("show");
        });
      }
    }
  }
});

observer.observe(document.getElementById("games"), {
  childList: true,
  subtree: true
});
  
</script>

<script>
function toolboxStart() {
  const toolbox = document.getElementById("toolbox");
  const toolboxIcon = document.getElementById("toolbox-icon");
  const toolboxContent = document.getElementById("toolbox-content");
  const toolboxButton = document.getElementById("toolbox-btn");

  let dragging = false;
  let moved = false;
  let startX = 0;
  let startY = 0;
  let offsetY = 0;
  let toolboxIsOpen = !toolboxContent.hidden;
  let toolboxOnLeft = false;

  toolbox.style.position = "fixed";
  toolbox.style.right = "0";
  toolbox.style.top = "50%";
  toolbox.style.transform = "translateY(-50%)";
  toolbox.style.cursor = "grab";
  toolbox.style.touchAction = "none";
  toolbox.style.display = "flex";
  toolbox.style.alignItems = "center";
  toolbox.style.flexDirection = "row-reverse";

  function updateToolboxIcon() {
    if (toolboxOnLeft) {
      toolboxIcon.className = toolboxIsOpen
        ? "fa-solid fa-caret-left"
        : "fa-solid fa-caret-right";
    } else {
      toolboxIcon.className = toolboxIsOpen
        ? "fa-solid fa-caret-right"
        : "fa-solid fa-caret-left";
    }
  }

  toolbox.addEventListener("pointerdown", e => {
    dragging = true;
    moved = false;

    startX = e.clientX;
    startY = e.clientY;

    const rect = toolbox.getBoundingClientRect();
    offsetY = e.clientY - rect.top;

    toolbox.style.cursor = "grabbing";
    toolbox.style.transform = "none";

    e.preventDefault();
  });

  document.addEventListener("pointermove", e => {
    if (!dragging) return;

    if (
      Math.abs(e.clientX - startX) > 5 ||
      Math.abs(e.clientY - startY) > 5
    ) {
      moved = true;
    }

    const maxY = window.innerHeight - toolbox.offsetHeight;
    const y = Math.max(
      0,
      Math.min(e.clientY - offsetY, maxY)
    );

    toolbox.style.top = `${y}px`;

    if (e.clientX < window.innerWidth / 2) {
      toolbox.style.left = "0";
      toolbox.style.right = "auto";
      toolbox.style.flexDirection = "row";
      toolboxOnLeft = true;
    } else {
      toolbox.style.left = "auto";
      toolbox.style.right = "0";
      toolbox.style.flexDirection = "row-reverse";
      toolboxOnLeft = false;
    }

    updateToolboxIcon();
  });

  document.addEventListener("pointerup", () => {
    if (!dragging) return;

    dragging = false;
    toolbox.style.cursor = "grab";
  });

  document.addEventListener("pointercancel", () => {
    dragging = false;
    toolbox.style.cursor = "grab";
  });

  toolboxButton.addEventListener("click", e => {
    if (moved) {
      moved = false;
      return;
    }

    toolboxIsOpen = !toolboxIsOpen;
    toolboxContent.hidden = !toolboxIsOpen;

    updateToolboxIcon();
  });

  updateToolboxIcon();
}

toolboxStart();
</script>
  
<script>
  function startElementRemover() {
  let active = true;
  let highlighted = null;

  function highlight(element) {
    if (!active) return;
    if (element === document.body || element === document.documentElement) return;

    if (highlighted && highlighted !== element) {
      highlighted.style.outline = highlighted.dataset.originalOutline || "";
    }

    if (highlighted !== element) {
      highlighted = element;
      highlighted.dataset.originalOutline = element.style.outline || "";
      element.style.outline = "2px solid red";
    }
  }

  function mouseMove(event) {
    if (!active) return;

    const element = document.elementFromPoint(
      event.clientX,
      event.clientY
    );

    highlight(element);
  }

  function click(event) {
    if (!active) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    const element = document.elementFromPoint(
      event.clientX,
      event.clientY
    );

    if (
      !element ||
      element === document.body ||
      element === document.documentElement
    ) {
      return;
    }

    element.remove();

    active = false;

    document.removeEventListener("mousemove", mouseMove, true);
    document.removeEventListener("click", click, true);

    if (highlighted) {
      highlighted.style.outline = highlighted.dataset.originalOutline || "";
      delete highlighted.dataset.originalOutline;
    }

    highlighted = null;
  }

  document.addEventListener("mousemove", mouseMove, true);
  document.addEventListener("click", click, true);
}


</script>
