<!DOCTYPE html>
<html>
<body>
<script>
const iframe = document.createElement("iframe");

iframe.src = location.origin;
iframe.style.cssText = `
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  margin: 0;
  padding: 0;
  z-index: 999999;
`;

document.body.appendChild(iframe);
</script>
</body>
</html>
