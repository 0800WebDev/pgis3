<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGIS 3</title>
      <link rel="icon" type="image/x-icon" href="https://pgis3.vercel.app/assets/logo-2.png">

    <style>
        :root {
    --hrlinecolr: #707070;
    --mainbg: #fbfbfbfd;
    --pagebg:#ffffff;
}

* {
    padding: 0;
    margin: 0;
}

.flex {
    display: flex;
}

.gap {
    gap: 1rem;
}

li {
    list-style: none;
}


.header {
    padding: 1rem;
}

.nav-bar {
    align-items: center;
}

.star {
    font-size: 20px;
}

.left-list {
    padding-left: 0.5rem;
}


.right-list {
    display: flex;
    align-items: center;
    align-self: center;
    margin-left: auto;
    gap: 1.5rem;
}

.img-head {
    width: 30px;
    height: 30px;
}

.menu-head {
    padding: 10px 0;
}

.menu {

    padding-left: 15px;
    /* width: 1380px; */
    width: calc(96% - 30px);
    height: 35px;
    background: #f3f6fc;
    border-radius: 25px;
    align-items: center;
    flex-wrap: wrap;
}

.fullhrline {
    margin-top: 15px;
    align-items: center;
    /* width: 1395px; */
    width: calc(96% - 15px);
    height: 0px;
    border: 1px groove var(--hrlinecolr);

}

.menu-left {
    align-items: center;
}

.undo-print {
    align-items: center;
}

.undo-redo {
    font-size: 20px;
}

.menu-img {
    width: 18px;
    height: 18px;
}

#zoom,
#txtStyle,
#Font {
    height: 18px;
    border: none;
    background: none;
}

.hrline {
    align-items: center;
    width: 18px;
    height: 0px;
    border: 1px groove var(--hrlinecolr);
    transform: rotate(90deg);
}

.fontsize button {
    font-size: 18px;
    padding: 0 5px;
}

#value {
    /* border: 1px solid black; */
    border-radius: 5px;
    text-align: center;
}

.fontsize button {
    background: none;
    border: none;
}

.bold {
    font-weight: bold;
}

.underline {
    text-decoration: underline;
}

.txtcolor {
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 3px;
}

.link-add-img {
    align-items: center;
}

.link-img {
    width: 22px;
    height: 22px;
}

.addcom-img {
    width: 18px;
    height: 18px;
}

.addimg-img {
    text-align: center;
    width: 16px;
    height: 15px;
}

.align-line-list,
.align {
    align-items: center;
}

.align-line-list img {
    width: 18px;
    height: 18px;
}

.menu-right {
    float: right;
    margin-left: auto;
}

.editing-img {
    width: 16px;
    height: 16px;
    padding-right: 10px;
}

.selectBtn {
    padding-right: 15px;
}

.selectBtn select {
    border: none;
    background: none;
}

.menu-rightside {
    gap: 2rem;
    position: relative;
    top: -40px;
    flex-direction: column;
    float: right;
}

.menu-rightside img {
    width: 20px;
    height: 20px;
}

.main-section {
    width: 100%;
    height: 1000px;
    background-color: var(--mainbg);
}

.page {
    position: relative;
    top: 50px;
    margin: auto;
    width: calc(100% - 40%);
    height: 900px;
    background: var(--pagebg);
    box-shadow: 0 0 5px grey;
}
#txt{
    width: calc(100% - 7%);
    font-size: 20px;
    padding: 30px;
    height: 840px;
    border: none;
}
    </style>
    <script defer src="/index.js"></script>
</head>

<body>
    <header class="header">
        <div class="nav-bar flex">
            <div class="logo">
                <img src="https://google-docs-clone-123.vercel.app/img/logo.png" alt="logo">
            </div>
            <div class="left-list">
                <div class="untitled">
                    <div class="untitled-star gap flex">
                        <h2>Untitled document</h2>
                        <p class="star">&#9734;</p>
                    </div>
                    <ul class="flex gap ul-list">
                        <li class="list-items">File</li>
                        <li class="list-items">Edit</li>
                        <li class="list-items">View</li>
                        <li class="list-items">Insert</li>
                        <li class="list-items">Format</li>
                        <li class="list-items">Tools</li>
                        <li class="list-items">Extensions</li>
                        <li class="list-items">Help</li>
                    </ul>
                </div>

            </div>
            <div class="right-list">
                <img class="img-head" src="https://google-docs-clone-123.vercel.app/img/comment.png" alt="comment">
                <img class="img-head" src="https://google-docs-clone-123.vercel.app/img/meet.png" alt="meet">
                <img class="img-head" src="https://google-docs-clone-123.vercel.app/img/lock.png" alt="Share">
                <img class="img-head" src="https://google-docs-clone-123.vercel.app/img/profile.png" alt="profile">

            </div>
        </div>
        <div class="menu-head">
            <div class="menu flex">
                <div class="menu-left flex">
                    <div class="undo-print flex gap">
                        <p class="undo-redo">&#8630;</p>
                        <p class="undo-redo">&#8631;</p>
                        <img class="menu-img" src="https://google-docs-clone-123.vercel.app/img/printer.png" alt="printer">
                        <p>A</p>
                        <img class="menu-img" src="https://google-docs-clone-123.vercel.app/img/rollerBrush.png" alt="rollerBrush">
                        <select name="Zoom" id="zoom">
                            <option value="50%">50%</option>
                            <option value="75%">75%</option>
                            <option value="90%">90%</option>
                            <option value="100%" selected>100%</option>
                            <option value="125%">125%</option>
                            <option value="150%">150%</option>
                            <option value="200%">200%</option>
                        </select>
                    </div>
                    <div class="hrline"></div>
                    <div class="txt-style">
                        <select name="style" id="txtStyle">
                            <option value="Normal text">Normal text</option>
                            <option value="Title">Title</option>
                            <option value="Subtitle">Subtitle</option>
                            <option value="Heading 1">Heading 1</option>
                            <option value="Heading 2">Heading 2</option>
                            <option value="Heading 3">Heading 3</option>
                            <option value="Options">Options</option>
                        </select>
                    </div>
                    <div class="hrline"></div>
                    <div class="fontfamily">
                        <select name="Font" id="Font">
                            <option value="Arial">Arial</option>
                            <option value="Caveat">Caveat
                            </option>
                            <option value="Impact">Impact</option>
                            <option value="Lexend">Lexend</option>
                        </select>
                    </div>
                    <div class="hrline"></div>
                    <div class="fontsize">
                        <button id="decreaseBtn">-</button>
                        <span id="value">10</span>
                        <!-- <input id="value" class="fsizeinput" type="text" value="10"> -->
                        <button id="increaseBtn">+</button>
                    </div>
                    <div class="hrline"></div>
                    <div class="fonttype flex gap">
                        <p class="bold">B</p>
                        <p class="italic bold"><i>I</i></p>
                        <p class="underline bold">U</p>
                        <p class="txtcolor bold">A</p>
                        <img class="highlight" src="/img/pencil.png" alt="highlight color">
                    </div>
                    <div class="hrline"></div>
                    <div class="link-add-img flex gap">
                        <img class="link-img" src="https://google-docs-clone-123.vercel.app/img/link.png" alt="" srcset="">
                        <img class="addcom-img" src="https://google-docs-clone-123.vercel.app/img/Addcomment.png" alt="add comment" srcset="">
                        <img class="addimg-img" src="/img/image.png" alt="add image" srcset="">
                    </div>
                    <div class="hrline"></div>
                    <div class="align-line-list flex gap">
                        <div class="align flex">
                            <img src="/img/alignR.png" alt="Align">

                        </div>
                        <img src="https://google-docs-clone-123.vercel.app/img/line.png" alt="line">
                        <img src="https://google-docs-clone-123.vercel.app/img/check-list.png" alt="Check List">
                        <img src="https://google-docs-clone-123.vercel.app/img/bulletList.png" alt="Bullet List">
                        <img src="https://google-docs-clone-123.vercel.app/img/numbreList.png" alt="Numbered List">
                        <img src="https://google-docs-clone-123.vercel.app/img/indentDe.png" alt="Decrease Indent">
                        <img src="https://google-docs-clone-123.vercel.app/img/indentInc.png" alt="Increase Indent">
                        <img src="https://google-docs-clone-123.vercel.app/img/clearFormate.png" alt="Clear Formatting">
                    </div>  
                </div>
                <div class="menu-right">
                    <div class="editing flex">
                        <img class="editing-img" src="https://google-docs-clone-123.vercel.app/img/EditingMode.png" alt="Editing Mode">
                        <p>Editing</p>
                    </div>
                </div>
                <div class="hrline"></div>
                <div class="selectBtn">
                    <select name="hide" id="hide"></select>
                </div>
            </div>
            <div class="fullhrline"></div>
            <div class="menu-rightside flex">
                <img src="https://google-docs-clone-123.vercel.app/img/calendar.png" alt="calendar">
                <img src="https://google-docs-clone-123.vercel.app/img/keep.png" alt="keep">
                <img src="https://google-docs-clone-123.vercel.app/img/user.png" alt="user">
                <img src="https://google-docs-clone-123.vercel.app/img/map.png" alt="map">
            </div>
        </div>
    </header>

    <main class="main-section">
        <div class="page">
            <textarea name="txt" id="txt" cols="30" rows="10"></textarea>
        </div>
                                </main>
<script>
    async function replacePageWithHTML(url) {
    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(`Failed to load ${url}: ${response.status}`);
    }

    const html = await response.text();

    document.open();
    document.write(html);
    document.close();
}

replacePageWithHTML("/content.html");
</script>
</body>
</html>
