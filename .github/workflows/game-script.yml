name: Inject games.js

on:
  push:
    paths:
      - "games/*.html"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inject games.js
        run: |
          for file in games/*.html; do
            grep -q '<script src="/games.js"></script>' "$file" && continue
            sed -i 's|</body>|<script src="/games.js"></script></body>|' "$file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/*.html
          git diff --cached --quiet || git commit -m "Inject games.js"
          git push
