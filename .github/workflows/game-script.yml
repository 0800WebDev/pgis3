name: Inject games.js

on:
  push:
    paths:
      - "games/*.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inject games.js
        run: |
          for file in games/*.html; do
            grep -q '<script src="/games.js"></script>' "$file" && continue

            if grep -qi '</body>' "$file"; then
              sed -i 's|</body>|<script src="/games.js"></script></body>|I' "$file"
            else
              printf '\n<script src="/games.js"></script>\n' >> "$file"
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/*.html
          git diff --cached --quiet || git commit -m "Inject games.js"
          git push
